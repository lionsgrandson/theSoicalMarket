<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{subject}}</title>
  <style>
    body { margin: 0; padding: 0; background: #f4f4f7; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .wrapper { width: 100%; background: #f4f4f7; padding: 32px 16px; box-sizing: border-box; }
    .card { max-width: 560px; margin: 0 auto; background: #ffffff; border-radius: 12px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
    .header { background: #0f172a; padding: 28px 36px; text-align: center; }
    .header-text { color: #ffffff; font-size: 15px; font-weight: 600; margin-top: 10px; letter-spacing: 0.02em; }
    .body { padding: 36px 36px 28px; }
    .greeting { font-size: 18px; font-weight: 600; color: #0f172a; margin: 0 0 12px; }
    .message { font-size: 15px; color: #374151; line-height: 1.7; margin: 0 0 24px; }
    .cta { display: block; width: fit-content; background: #facc15; color: #0f172a; text-decoration: none; font-weight: 700; font-size: 15px; padding: 13px 28px; border-radius: 8px; margin: 0 auto 8px; text-align: center; }
    .cta-note { text-align: center; font-size: 12px; color: #9ca3af; margin: 0 0 20px; }
    .divider { height: 1px; background: #f0f0f0; margin: 24px 0; }
    .footer { background: #f8fafc; padding: 20px 36px; text-align: center; }
    .footer p { font-size: 12px; color: #9ca3af; margin: 4px 0; line-height: 1.6; }
    .footer a { color: #6b7280; text-decoration: underline; }
    @media (max-width: 600px) {
      .body, .footer { padding-left: 20px; padding-right: 20px; }
      .cta { width: 100%; box-sizing: border-box; }
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <div class="card">
      <div class="header">
        <div class="header-text">The Social Market</div>
      </div>
      <div class="body">
        <p class="greeting">Dear {{first_name}},</p>
        <div class="message">{{body_html}}</div>
        {% if cta_url %}
        <a class="cta" href="{{cta_url}}">{{cta_label}}</a>
        <p class="cta-note">Or copy this link: <a href="{{cta_url}}" style="color:#6b7280;">{{cta_url}}</a></p>
        {% endif %}
        <div class="divider"></div>
        <p style="font-size:14px;color:#374151;margin:0;">Best Regards,<br /><strong>The Social Market Team</strong></p>
      </div>
      <div class="footer">
        <p>You received this email because you have an account at <a href="https://thesocialmarket.ai">thesocialmarket.ai</a>.</p>
        <p><a href="https://thesocialmarket.ai/settings/notifications">Manage notification preferences</a></p>
      </div>
    </div>
  </div>
</body>
</html>

version: '3.8'

services:
  subscription_service_lb:
    image: nginx:1.25-alpine
    container_name: subscription_service_lb
    ports:
      - "8001:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    networks:
      - microservices_shared_network
    depends_on:
      - subscription_service

  subscription_service:
    build: .
    command: gunicorn src.wsgi:application --bind 0.0.0.0:8000 --workers 4
    volumes:
      - .:/app
    networks:
      - microservices_shared_network
    depends_on:
      - subscription_postgres_db
    env_file:
      - .env

  subscription_postgres_db:
    image: postgres:16-alpine
    container_name: postgres_db_container_subscription_service
    volumes:
      - subscription_service_postgres_data:/var/lib/postgresql/data/
    environment:
      - POSTGRES_DB=subscription_service_db
      - POSTGRES_USER=subscription_service_user
      - POSTGRES_PASSWORD=a_strong_password
    networks:
      - microservices_shared_network

networks:
  microservices_shared_network:
    external: true

volumes:
  subscription_service_postgres_data: {}

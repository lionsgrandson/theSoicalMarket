upstream django_gateways {
    server gateway_service:8000;
}


upstream chat_service_lb {
    server chat_service_lb:80;
}

upstream user_service_load_balancer {
    server user_service_load_balancer:80;
}




server {
    listen 80;
    server_name backend.thesocialmarket.ai;
    return 301 https://$host$request_uri;
}



# And we define our server.
server {
    #listen 80;
    listen 443 ssl;
    client_max_body_size 100M;
    server_name backend.thesocialmarket.ai;




    ssl_certificate /etc/letsencrypt/live/backend.thesocialmarket.ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/backend.thesocialmarket.ai/privkey.pem;



    # added by RONI_VAI
    location /chat_handshake/{
        
        proxy_pass http://chat_service_lb/;

        # # commented by RONI_VAI
        # proxy_pass http://chat_service_lb:8000;

        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_redirect off;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
      
        proxy_set_header Connection "upgrade";
    }
    location /static/user-service/ {
        proxy_pass http://user_service_load_balancer;
        proxy_set_header Host $host;
    }

    location /api/user_service/admin/ {
        proxy_pass http://user_service_load_balancer/admin/;
        
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_redirect off;
    }

    location / {
        proxy_pass http://django_gateways;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_redirect off;
    }
}

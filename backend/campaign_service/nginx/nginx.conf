upstream campaign_service_servers {
    server campaign_service:8000;
}

server {
    listen 80;
    client_max_body_size 100M;

    location / {
        proxy_pass http://campaign_service_servers;
        
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_redirect off;
    }
}